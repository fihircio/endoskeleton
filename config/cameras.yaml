# spec §17–19 — OV5642 behind camera interface (no Arducam API in app code).
cameras:
  left:
    topic: /camera/left/image_raw
    frame_id: camera_left_link
    parent_frame: head_link
    mount_xyz_rpy: [-0.03, 0.0, 0.05, 0.0, 0.0, 0.0]
    width: 640
    height: 480
    fps: 15  # conservative for Pi 4 #2 + software sync (§19)
  right:
    topic: /camera/right/image_raw
    frame_id: camera_right_link
    parent_frame: head_link
    mount_xyz_rpy: [0.03, 0.0, 0.05, 0.0, 0.0, 0.0]
    width: 640
    height: 480
    fps: 15
stereo:
  software_sync: true   # no HW sync assumed (§19)
  approximate_sync_slop_s: 0.05
