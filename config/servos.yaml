# spec §10–12 — PCA9685 calibration. YAML only, never in source.
# V1 allocation (§2.5): MG995#1 → left elbow, MG995#2 → right elbow, DS3109MG → neck pan.
pca9685:
  board_1: {i2c_bus: 1, i2c_address: "0x40", pwm_freq_hz: 50}
  board_2: {i2c_bus: 1, i2c_address: "0x41", pwm_freq_hz: 50}  # reserved for future joints

servos:
  left_elbow_pitch:
    board: board_1
    channel: 0
    model: MG995
    min_angle_deg: 10.0
    max_angle_deg: 170.0
    center_angle_deg: 90.0
    reverse: false
    pwm_min_us: 500
    pwm_max_us: 2500
    max_speed_deg_s: 60.0   # slow moves for safety (§12, §59)
  right_elbow_pitch:
    board: board_1
    channel: 1
    model: MG995
    min_angle_deg: 10.0
    max_angle_deg: 170.0
    center_angle_deg: 90.0
    reverse: true
    pwm_min_us: 500
    pwm_max_us: 2500
    max_speed_deg_s: 60.0

  # --- neck (driven by the Wemos bridge, not the Pi) ---
  left_neck_pan:
    board: wemos_pca9685
    channel: 1
    model: MG995-360        # continuous rotation: speed+direction, no feedback
    type: continuous
    range_deg: [0, 180]     # containment limits for the neck linkage
    stop_us: 1500           # CALIBRATE: pulse that makes it stop
    speed_us: 300           # pulse deviation for full speed
    max_speed_deg_s: 69.0   # rate at full deviation (dead-reckoned)
    deadband_deg: 2.9
  up_neck_tilt:
    board: wemos_pca9685
    channel: 4
    model: MG995            # positional
    type: positional
    range_deg: [20, 160]
    min_angle_deg: 10.0
    max_angle_deg: 170.0
    center_angle_deg: 90.0
    reverse: false
    pwm_min_us: 1000
    pwm_max_us: 2000
    max_speed_deg_s: 60.0

safety:
  command_timeout_s: 0.5   # → HOLD/SAFE on timeout (§12)
  startup_require_enable: true
  initial_position_slow: true
